name: test-data
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: |
          python - <<'EOF'
          import requests
          H = {"User-Agent": "Mozilla/5.0 (compatible; RadarTest/1.0)"}
          B = "https://www.okx.com/api/v5/"

          def check(name, path, show=0):
              try:
                  r = requests.get(B + path, headers=H, timeout=20)
                  j = r.json()
                  d = j.get("data", [])
                  print(f"[{name}] HTTP {r.status_code} code={j.get('code')} baris={len(d)} {str(j.get('msg'))[:50]}")
                  for row in d[:show]:
                      print("    ", row)
              except Exception as e:
                  print(f"[{name}] GAGAL {type(e).__name__}")

          for bar in ["5m", "15m", "30m", "1H", "4H", "1Dutc", "1Mutc"]:
              check("candle BTC " + bar, f"market/candles?instId=BTC-USDT-SWAP&bar={bar}&limit=300")
          check("candle 10 Okt 2025 BTC", "market/history-candles?instId=BTC-USDT-SWAP&bar=1Dutc&after=1760140800000&limit=2", show=2)
          check("candle 10 Okt 2025 SOL", "market/history-candles?instId=SOL-USDT-SWAP&bar=1Dutc&after=1760140800000&limit=2", show=2)
          check("OI+volume BTC 5m", "rubik/stat/contracts/open-interest-volume?ccy=BTC&period=5m", show=2)
          check("OI+volume BTC 1H", "rubik/stat/contracts/open-interest-volume?ccy=BTC&period=1H", show=2)
          check("order book BTC", "market/books?instId=BTC-USDT-SWAP&sz=20")
          check("likuidasi ETH", "public/liquidation-orders?instType=SWAP&state=filled&uly=ETH-USDT")
          EOF
